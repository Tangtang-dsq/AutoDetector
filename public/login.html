<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoDetector 登录</title>
  <link rel="stylesheet" href="https://unpkg.com/layui@2.9.21/dist/css/layui.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="login-body">
  <main class="login-shell">
    <section class="login-panel">
      <div class="login-brand">
        <div class="brand-badge">A</div>
        <div>
          <h1>AutoDetector</h1>
          <p>设备检测与文件管理后台</p>
        </div>
      </div>
      <form class="layui-form" id="loginForm">
        <div class="layui-form-item">
          <label class="layui-form-label">密码</label>
          <div class="layui-input-block">
            <input id="password" type="password" autocomplete="current-password" class="layui-input" autofocus>
          </div>
        </div>
        <button id="loginButton" class="layui-btn layui-btn-fluid" type="submit">登录后台</button>
      </form>
    </section>
  </main>
  <script src="https://unpkg.com/layui@2.9.21/dist/layui.js"></script>
  <script src="/login.js"></script>
</body>
</html>
